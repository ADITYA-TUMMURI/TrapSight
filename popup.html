<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrapSight Settings</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #151d30;
      --text-color: #f3f4f6;
      --text-muted: #9ca3af;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --success: #10b981;
      --border-color: #1f2937;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      width: 320px;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .logo-container {
      background: linear-gradient(135deg, #818cf8 0%, #6366f1 100%);
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: white;
      font-size: 18px;
      box-shadow: 0 4px 10px rgba(99, 102, 241, 0.3);
    }

    .title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .description {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .input-wrapper {
      position: relative;
    }

    input[type="password"] {
      width: 100%;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 13px;
      transition: all 0.2s ease;
    }

    input[type="password"]:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }

    .btn {
      display: block;
      width: 100%;
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .btn:hover {
      background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 12px;
      background-color: rgba(239, 68, 68, 0.1);
      color: #ef4444;
      margin-top: 10px;
      font-weight: 500;
      border: 1px solid rgba(239, 68, 68, 0.15);
    }

    .status-badge.active {
      background-color: rgba(16, 185, 129, 0.1);
      color: var(--success);
      border-color: rgba(16, 185, 129, 0.15);
    }

    .status-badge .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: currentColor;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-container">👁️</div>
    <div class="title">TrapSight</div>
  </div>
  <p class="description">Exposes subscription traps, hidden costs, and automatic renewal traps before you checkout.</p>
  
  <div class="form-group">
    <label for="apiKey">Gemini API Key</label>
    <div class="input-wrapper">
      <input type="password" id="apiKey" placeholder="Enter Gemini API Key..." />
    </div>
  </div>

  <button id="saveBtn" class="btn">Save API Key</button>

  <div id="status" class="status-badge">
    <div class="dot"></div>
    <span>Key Not Configured</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
